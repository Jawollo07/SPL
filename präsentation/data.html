<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Display Daten auslesen</title>
</head>
<body>

    <h2>Deine Display-Daten:</h2>
    <div id="display-info">Lade Daten...</div>

    <script>
        function getDisplayData() {
            const infoDiv = document.getElementById('display-info');
            
            // Daten zusammenstellen
            const data = {
                "Bildschirm-Gesamtbreite": screen.width + " px",
                "Bildschirm-Gesamthöhe": screen.height + " px",
                "Verfügbare Breite (ohne Taskleiste)": screen.availWidth + " px",
                "Verfügbare Höhe (ohne Taskleiste)": screen.availHeight + " px",
                "Aktuelle Browserfenster-Breite": window.innerWidth + " px",
                "Aktuelle Browserfenster-Höhe": window.innerHeight + " px",
                "Farbtiefe": screen.colorDepth + " Bit",
                "Pixeldichte (Device Pixel Ratio)": window.devicePixelRatio
            };

            // HTML-Ausgabe aufbauen
            let html = "<ul>";
            for (const [key, value] of Object.entries(data)) {
                html += `<li><strong>${key}:</strong> ${value}</li>`;
            }
            html += "</ul>";

            infoDiv.innerHTML = html;
        }

        // Funktion beim Laden der Seite ausführen
        window.onload = getDisplayData;
        
        // Aktualisieren, falls der User das Fenster verkleinert/vergrößert
        window.onresize = getDisplayData;
    </script>

</body>
</html>
