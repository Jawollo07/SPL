name: .NET CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Löst den Release-Job aus, wenn ein Tag mit "v" beginnt (z. B. v1.0.0)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # 1. Erstellt die fertigen Dateien für die Veröffentlichung
    - name: Publish
      run: dotnet publish -c Release -o ./publish

    # 2. Speichert die Dateien temporär ab
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app-files
        path: ./publish

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt das Erstellen von Releases
    if: startsWith(github.ref, 'refs/tags/') # Läuft NUR bei einem Git-Tag

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: dotnet-app-files
        path: ./app

    # Packt den Ordner in eine ZIP-Datei für den Download im Release
    - name: Zip Files
      run: zip -r dotnet-app-${{ github.ref_name }}.zip ./app

    # Erstellt das Release auf GitHub
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dotnet-app-${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
