name: .NET

on:
  push:
    # Der Workflow reagiert weiterhin auf main, erstellt ein Release aber z.B. nur bei Tags
    branches: [ "main" ]
    tags:
      - 'v*' # Löst aus, wenn Sie ein Tag wie v1.0.0 pushen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0' # Ihre gewünschte Version
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # Erstellt die fertigen .NET-Dateien (Artefakte)
    - name: Publish Projekt
      run: dotnet publish -c Release -o ./publish

    # Temporäres Speichern, damit der nächste Job darauf zugreifen kann
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app
        path: ./publish/

  release:
    needs: build # Läuft erst, wenn der Build-Job erfolgreich war
    runs-on: ubuntu-latest
    # Wichtig: Der GITHUB_TOKEN benötigt Schreibrechte für Releases
    permissions:
      contents: write

    # Bedingung: Dieser Job läuft NUR, wenn Sie ein Git-Tag pushen (z.B. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app
        path: ./artifacts

    # Zippen Sie die Dateien für den Release-Anhang (optional, aber empfohlen)
    - name: Zip Artifacts
      run: zip -r dotnet-app-${{ github.ref_name }}.zip ./artifacts

    # Erstellt das GitHub Release und lädt die Zip-Datei hoch
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dotnet-app-${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
