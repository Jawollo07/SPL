name: .NET Single-File Multi-Platform

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            binary_name: SPL-windows.exe
          - rid: linux-x64
            binary_name: SPL-linux
          - rid: osx-x64
            binary_name: SPL-macos

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      run: dotnet test --no-build --verbosity normal

    # Publish als Single-File und Self-Contained
    - name: Publish for ${{ matrix.rid }}
      run: >
        dotnet publish -c Release 
        -r ${{ matrix.rid }} 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishReadyToRun=true 
        -o ./publish/${{ matrix.rid }}

    # Benennt die Datei eindeutig um, damit sie im Release unterscheidbar ist
    - name: Rename Binary
      shell: bash
      run: |
        cd ./publish/${{ matrix.rid }}
        # Ermittelt den Namen der erstellten Datei (egal ob mit .exe oder ohne)
        ORIGINAL_FILE=$(find . -maxdepth 1 -type f -not -name "*.pdb" | head -n 1)
        mv "$ORIGINAL_FILE" "${{ matrix.binary_name }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.rid }}
        path: ./publish/${{ matrix.rid }}/${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: win-x64
        path: ./release-files

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: linux-x64
        path: ./release-files

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: osx-x64
        path: ./release-files

    # Lädt die drei fertigen ausführbaren Dateien direkt in das GitHub-Release hoch
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./release-files/SPL.exe
          ./release-files/SPL-linux
          ./release-files/SPL-macos
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
